name: CI/CD - Terraform Banco de Dados

on:
  push:
    branches:
      - main
      - homologacao
      - develop
      - feature/diogo
      - feature/alexandra
      - feature/rodrigo
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: terraform-bd-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: "sa-east-1"
  PROJECT_NAME: "f1rsters-tech-challenge-mecanica"

jobs:
  terraform_plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=f1rsters-tech-challenge-terraform-state" \
            -backend-config="key=tech-challenge-mecanica/terraform-bd.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Create terraform.tfvars
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            ENV="prod"
          elif [ "${{ github.ref }}" == "refs/heads/homologacao" ]; then
            ENV="homolog"
          else
            ENV="dev"
          fi

          cp "terraform.tfvars.${ENV}" terraform.tfvars
          echo "db_password = \"${{ secrets.DB_PASSWORD }}\"" >> terraform.tfvars

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Plan Summary
        id: plan
        run: terraform show -no-color tfplan

      - name: Comment PR with Terraform Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan (Banco de Dados) 📖
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

  terraform_apply:
    name: Terraform Apply
    needs: terraform_plan
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/homologacao'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'homologation' }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=f1rsters-tech-challenge-terraform-state" \
            -backend-config="key=tech-challenge-mecanica/terraform-bd.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Create terraform.tfvars
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            ENV="prod"
          elif [ "${{ github.ref }}" == "refs/heads/homologacao" ]; then
            ENV="homolog"
          else
            ENV="dev"
          fi

          cp "terraform.tfvars.${ENV}" terraform.tfvars
          echo "db_password = \"${{ secrets.DB_PASSWORD }}\"" >> terraform.tfvars

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Terraform Outputs
        run: terraform output
